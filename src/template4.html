<style>
  :root {
    --glass: rgba(10, 12, 20, .64); --glass2: rgba(22, 26, 40, .82); --edge: rgba(214, 186, 112, .28); --edge2: rgba(214, 186, 112, .55);
    --text: #ecebe6; --muted: #a3a6b3; --gold: #f1cf73; --hp1: #ef6b5d; --hp2: #b5302a; --mp1: #5fa0f2; --mp2: #2d5fb6; --tp1: #f2cb55; --tp2: #b9851a;
    --xp: #8fd66a; --sc: #f6a5ff; --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --slot: 52px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080c; color: var(--text); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior: none; }
  body { position: fixed; inset: 0; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .plate { position: absolute; left: 0; top: 0; text-align: center; white-space: nowrap; will-change: transform; }
  .plate .pn { font-size: 12px; font-weight: 600; text-shadow: 0 1px 2px #000, 0 0 3px #000; }
  .plate.tgt .pn { font-size: 13px; }
  .plate .pb, .plate .pc { width: 46px; height: 4px; margin: 2px auto 0; background: rgba(0,0,0,.65); border-radius: 2px; overflow: hidden; }
  .plate .pb div, .plate .pc div { height: 100%; }
  .floater { position: absolute; left: 0; top: 0; font-weight: 800; text-shadow: 0 0 3px #000, 0 2px 3px #000, 0 0 1px #000; white-space: nowrap; will-change: transform; }
  .floater.dmg { font-family: var(--ffFont, sans-serif); font-style: italic; font-weight: 900; -webkit-text-stroke: 1px #2a0000; text-shadow: 0 0 2px #000, 1px 2px 0 #3a0000, 0 0 8px rgba(255,40,20,.55); pointer-events: none; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen; }
  #joy { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.06), rgba(255,255,255,.12)); border: 2px solid rgba(241,207,115,.35); display: none; pointer-events: none; z-index: 3; }
  #knob { position: absolute; left: 36px; top: 36px; width: 44px; height: 44px; border-radius: 50%; background: rgba(241,207,115,.45); box-shadow: 0 0 12px rgba(241,207,115,.4); }
  #ui { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  #ui > * { pointer-events: auto; }
  .glass { background: var(--glass); border: 1px solid var(--edge); border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  button { font: inherit; color: var(--text); background: linear-gradient(#2a2f44, #1b1f2e); border: 1px solid var(--edge); border-radius: 8px; padding: 7px 11px; cursor: pointer; touch-action: manipulation; }
  button:hover { border-color: var(--edge2); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }
  button.on { border-color: var(--gold); color: var(--gold); }
  .bar { position: relative; height: 10px; background: rgba(0,0,0,.55); border-radius: 5px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px; transition: width .18s linear; }
  .bar > b { position: absolute; inset: 0; font-size: 9px; line-height: 10px; text-align: right; padding-right: 4px; font-weight: 700; text-shadow: 0 0 2px #000, 0 0 2px #000; }
  .bar.hp > i { background: linear-gradient(var(--hp1), var(--hp2)); }
  .bar.mp > i { background: linear-gradient(var(--mp1), var(--mp2)); }
  .bar.tp > i { background: linear-gradient(var(--tp1), var(--tp2)); }
  .bar.xp { height: 4px; margin-top: 2px; }
  .bar.xp > i { background: linear-gradient(#d4f59a, #7cb342); }
  #xpbar { display: none; }
  .bar.cast > i { background: linear-gradient(#a8d4ff, #4d8fe0); }
  .bar.warn > i { background: linear-gradient(#ffab70, #e2482a); }
  .bar .ghost { background: rgba(255,255,255,.35); transition: width .6s ease-out .25s; }

  #party { position: absolute; left: calc(8px + var(--sal)); top: calc(8px + var(--sat)); width: 236px; display: flex; flex-direction: column; gap: 4px; }
  .pf { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 5px 7px 6px 5px; cursor: pointer; position: relative; }
  .pf.sel { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(241,207,115,.35), 0 4px 18px rgba(0,0,0,.35); }
  .pf.ko { filter: grayscale(.9) brightness(.7); }
  .pf .por { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; border: 2px solid rgba(255,255,255,.25); background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), rgba(0,0,0,.5)); position: relative; }
  .pf .por em { position: absolute; right: -5px; bottom: -4px; font-style: normal; font-size: 9px; font-weight: 800; background: #11131c; border: 1px solid var(--edge2); border-radius: 6px; padding: 0 3px; color: var(--gold); }
  .pf .top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
  .pf .nm { font-weight: 700; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pf .jb { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .pf .bars { display: grid; gap: 2px; margin-top: 2px; }
  .pf .bar { height: 9px; }
  .pf .bar.tp { height: 4px; }
  .pf .bar.tp > b { display: none; }
  .pf .bufs { position: absolute; left: 2px; bottom: 2px; display: flex; gap: 1px; font-size: 9px; }
  .pf .bufs span { background: #11131c; border: 1px solid var(--edge); border-radius: 4px; padding: 0 2px; }
  .pf .cb { position: absolute; left: 44px; right: 7px; bottom: 1px; height: 2px; }
  .pf .st { position: absolute; left: 3px; top: 3px; font-size: 9px; }

  #tCmd { position: absolute; right: calc(10px + var(--sar)); bottom: calc(12px + var(--sab)); width: 230px; max-height: 52vh; overflow-y: auto; display: none; flex-direction: column; gap: 5px; padding: 8px; pointer-events: auto; z-index: 6; }
  #tCmd.on { display: flex; }
  #tCmd .tcHead { font-size: 12px; color: var(--gold); letter-spacing: .04em; display: flex; justify-content: space-between; align-items: center; }
  #tCmd button { flex: 0 0 auto; text-align: left; min-width: 0; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.16); background: rgba(30,32,44,0.9); color: #e8e2d0; font: inherit; font-size: 12.5px; cursor: pointer; }
  #tCmd button:hover { border-color: #e6c36a; }
  #tCmd button.pri { border-color: #e6c36a; color: #ffe7a8; }
  #tCmd button.off { opacity: 0.45; }
  #raceBox { position: absolute; left: 50%; top: calc(110px + var(--sat)); transform: translateX(-50%); padding: 7px 14px; display: none; z-index: 6; font-size: 14px; white-space: nowrap; }
  #raceBox.on { display: block; }
  #fishBox { position: absolute; left: 50%; bottom: calc(150px + var(--sab)); transform: translateX(-50%); padding: 8px 14px; display: none; align-items: center; gap: 10px; pointer-events: auto; z-index: 7; font-size: 14px; }
  #fishBox.on { display: flex; }
  #fishBox button { padding: 6px 14px; border-radius: 8px; }
  #fishBox.bite { border-color: #ffd54f; box-shadow: 0 0 18px rgba(255,213,79,.55); animation: fishPulse .5s ease-in-out infinite alternate; }
  @keyframes fishPulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.06); } }
  #pool { position: absolute; left: calc(10px + var(--sal)); bottom: calc(230px + var(--sab)); width: 250px; padding: 7px 8px; display: none; pointer-events: auto; z-index: 6; }
  #pool.on { display: block; }
  #pool .ph { font-size: 11px; color: var(--gold); letter-spacing: .06em; margin-bottom: 4px; }
  #pool .pe { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid rgba(255,255,255,.07); font-size: 12.5px; }
  #pool .pe:first-of-type { border-top: 0; }
  #pool .pe b { flex: 1; font-weight: 600; }
  #pool .pe small { color: var(--muted); }
  #pool button { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
  #tCmd .tcHead button { padding: 2px 8px; text-align: center; }
  #tCmd .tcInfo { flex-basis: 100%; font-size: 12.5px; color: #d8d0bc; line-height: 1.4; }
  #target { position: absolute; left: 50%; top: calc(8px + var(--sat)); transform: translateX(-50%); width: 360px; padding: 7px 10px 8px; display: none; }
  #target .tn { display: flex; align-items: baseline; gap: 6px; }
  #tName { font: 700 15px var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tLv { font-size: 11px; color: var(--muted); white-space: nowrap; }
  #tTag { font-size: 9px; font-weight: 800; letter-spacing: .06em; padding: 1px 5px; border-radius: 4px; background: #5b1420; color: #ffb3bd; border: 1px solid #ff6f81; display: none; }
  #tToT { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
  #target .bar.hp { height: 13px; margin-top: 4px; }
  #target .bar.hp > b { font-size: 10px; line-height: 13px; }
  #tRow2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 3px; }
  #tRow2 .bar { height: 5px; }
  #target.npc .bar, #target.npc #tRow2 { display: none; }
  #tInfo { font-size: 11px; color: var(--muted); margin-top: 4px; min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tWarn { display: none; margin-top: 4px; font-weight: 800; color: #ffb199; text-shadow: 0 0 6px #ff4d1a; animation: pulse .5s ease-in-out infinite alternate; }
  #tChain { margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; }
  #mBody .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 10px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); }
  #tChain .chip { padding: 1px 6px; border-radius: 10px; background: rgba(0,0,0,.5); border: 1px solid rgba(246,165,255,.5); color: var(--sc); }
  #tChain .chip .w { display: inline-block; width: 38px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); margin-left: 4px; vertical-align: 1px; overflow: hidden; }
  #tChain .chip .w i { display: block; height: 100%; background: var(--sc); }
  @keyframes pulse { from { opacity: .65; } to { opacity: 1; } }

  #topRight { position: absolute; right: calc(8px + var(--sar)); top: calc(8px + var(--sat)); width: 168px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #mmWrap { position: relative; width: 150px; height: 150px; border-radius: 50%; border: 2px solid var(--edge2); box-shadow: 0 0 0 3px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.45); overflow: hidden; background: #0b0d14; cursor: pointer; }
  #minimap { width: 100%; height: 100%; display: block; }
  #mmN { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; font: 800 11px var(--serif); color: var(--gold); text-align: center; line-height: 16px; text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; }
  #clockBox { text-align: right; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  #zoneName { font: 700 13px var(--serif); color: var(--gold); }
  #clock { font-size: 12px; }
  #clock .el { font-size: 11px; padding: 0 5px; border-radius: 6px; margin-left: 4px; border: 1px solid rgba(255,255,255,.25); }
  #trBtns { display: flex; gap: 5px; }
  #trBtns button { width: 36px; height: 34px; padding: 0; font-size: 16px; }
  #tracker { width: 220px; padding: 7px 9px; font-size: 11px; display: none; }
  #tracker h4 { margin: 0 0 3px; font: 700 12px var(--serif); color: var(--gold); display: flex; justify-content: space-between; cursor: pointer; }
  #tracker .q { margin-top: 5px; }
  #tracker .q b { color: #f5e7c1; font-weight: 600; }
  #tracker .q div { color: var(--muted); }
  #tracker .q .ok { color: var(--xp); }
  #tracker.min .q { display: none; }

  #chat { position: absolute; left: calc(8px + var(--sal)); bottom: calc(10px + var(--sab)); width: 380px; display: flex; flex-direction: column; }
  #chatTabs { display: flex; gap: 2px; padding: 3px 3px 0; }
  #chatTabs button { padding: 3px 9px; font-size: 11px; border-radius: 7px 7px 0 0; border-bottom: none; background: rgba(10,12,20,.7); }
  #chatTabs button.on { color: var(--gold); background: var(--glass2); }
  #chatTabs .tog { margin-left: auto; }
  #log { height: 150px; overflow-y: auto; padding: 5px 8px; font-size: 12px; border-radius: 0 10px 10px 10px; scrollbar-width: thin; }
  #log div { text-shadow: 0 1px 1px #000; }
  #log .you { color: #a5e07e; } #log .foe { color: #ff9a8f; } #log .sys { color: #b9bcc6; } #log .ally { color: #93c9ff; }
  #log .loot { color: var(--gold); } #log .sc { color: var(--sc); } #log .npc { color: #ead9ae; } #log .skill { color: #86d3c8; } #log .party { color: #b9e6fb; font-style: italic; }
  #log.f-combat div:not(.you):not(.foe):not(.ally):not(.sc):not(.skill) { display: none; }
  #log.f-loot div:not(.loot) { display: none; }
  #log.f-system div:not(.sys):not(.npc):not(.party) { display: none; }
  #chat.min #log { height: 54px; overflow: hidden; background: linear-gradient(rgba(10,12,20,0), rgba(10,12,20,.55)); border-color: transparent; box-shadow: none; pointer-events: none; }
  #chat.min #chatTabs button:not(.tog) { display: none; }
  #fpsBox { position: absolute; left: 50%; top: calc(4px + var(--sat)); transform: translateX(-50%); z-index: 20; display: none; font: 11px ui-monospace, monospace; color: #9ad06b; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 6px; pointer-events: none; }
  #confirmBox { position: absolute; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(4,5,9,.55); pointer-events: auto; }
  #confirmBox.on { display: flex; }
  #confirmBox .cb { width: min(380px, 90vw); padding: 16px 18px; border-color: var(--gold); box-shadow: 0 0 28px rgba(0,0,0,.6); animation: tin .2s ease-out; }
  #confirmBox .cbT { font: 700 16px var(--serif); color: var(--gold); margin-bottom: 6px; }
  #confirmBox .cbB { font-size: 13px; line-height: 1.55; color: #e2dfd6; }
  #confirmBox .cbA { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  #confirmBox .cbA button { padding: 8px 16px; }
  #confirmBox .cbA .pri { border-color: var(--gold); color: var(--gold); }
  #confirmBox .cbA .danger { border-color: #ff8a80; color: #ff8a80; }
  #verPop { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); z-index: 25; width: min(380px, 90vw); padding: 14px 16px; display: none; pointer-events: auto; border-color: var(--gold); box-shadow: 0 0 28px rgba(241,207,115,.3); animation: tin .3s ease-out; }
  #verPop .vpT { font: 700 16px var(--serif); color: var(--gold); margin-bottom: 6px; }
  #verPop .vpB { font-size: 12.5px; line-height: 1.55; color: #e2dfd6; }
  #verPop .vpB ul { margin: 6px 0 0 18px; padding: 0; }
  #verPop .vpB .sub { color: var(--muted); font-size: 11.5px; }
  #verPop .vpA { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #verPop .vpA button { padding: 7px 14px; }
  #verPop .vpA .pri { border-color: var(--gold); color: var(--gold); }
  body, #ui, #overlay, #loading, #menu { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  #chatIn { margin-top: 4px; height: 26px; padding: 0 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); background: rgba(10,12,20,.7); color: #f2efe6; font: 12px system-ui; outline: none; pointer-events: auto; }
  #chatIn:focus { border-color: var(--gold); background: rgba(10,12,20,.9); }
  #chatIn::placeholder { color: #8c8a84; }
  #log .say { color: #f4f1e8; }
  #log .shout { color: #ffab91; font-weight: 600; } #log .tell { color: #f48fb1; }
  #log.f-chat div:not(.say):not(.shout):not(.tell):not(.party):not(.pchat):not(.ls) { display: none; }
  #log .pchat { color: #80deea; }
  .beast .bpic { width: 84px; height: 84px; flex: none; border-radius: 10px; border: 1px solid var(--edge2); background: radial-gradient(circle at 50% 40%, rgba(120,150,210,.35), rgba(10,14,28,.85)); display: grid; place-items: center; overflow: hidden; }
  .beast .bpic img { width: 100%; height: 100%; object-fit: contain; } .beast .bpic span { font-size: 28px; color: #6a7490; } #log .ls { color: #a5d6a7; }
  .pf.net .nm { color: #9fd0ff; } .pf.far { opacity: .62; }
  .trd { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .trd .side { border: 1px solid var(--edge2); border-radius: 10px; padding: 8px; min-height: 120px; } .trd .side.ok { border-color: #8fd66a; box-shadow: 0 0 0 1px rgba(143,214,106,.35); } .trd .ln { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 3px 0; font-size: 13px; }
  @media (max-width: 720px) { .trd { grid-template-columns: 1fr; } }

  #bottom { position: absolute; left: 50%; bottom: calc(8px + var(--sab)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px; }
  #castBar { width: 260px; display: none; padding: 4px 7px; text-align: center; font-size: 11px; }
  #castBar .bar { height: 7px; margin-top: 3px; }
  #barWrap { display: flex; align-items: center; gap: 4px; padding: 5px; }
  #pager { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  #pager button { width: 24px; height: 20px; padding: 0; font-size: 10px; }
  #pager span { font-size: 11px; color: var(--gold); font-weight: 700; }
  #actionBar { display: flex; flex-wrap: wrap; gap: 4px; min-height: var(--slot); max-width: calc(var(--slot) * 10 + 36px); }
  .slot { width: var(--slot); height: var(--slot); border-radius: 9px; position: relative; padding: 0; display: grid; place-items: center; overflow: visible; background: radial-gradient(circle at 50% 35%, #2c3248, #141722); border: 1px solid rgba(255,255,255,.14); }
  .slot.empty { background: rgba(0,0,0,.35); border-style: dashed; }
  #actionBar .slot.empty { display: none; }
